<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Service Status</h1>
            <p class="last-update">Last updated: <span id="last-update">Never</span></p>
        </header>

        <div id="backend-offline-alert" class="alert alert-warning" style="display: none;">
            <strong>Monitoring System Offline</strong>
            <p>The backend has not reported in over 10 minutes.</p>
        </div>

        <div id="services-container">
            <div class="loading">Loading service status...</div>
        </div>
    </div>

    <footer>
        <p>Auto-refreshes every 30 seconds</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
